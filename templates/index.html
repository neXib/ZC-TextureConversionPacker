<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megascans Texture Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .form-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .browse-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .browse-btn:hover {
            background: #5568d3;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.9em;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .status-text {
            text-align: center;
            margin: 10px 0;
            font-size: 1.1em;
            color: #333;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .logs-container {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
        }

        .log-entry {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .log-entry.info {
            background: #e3f2fd;
            color: #1565c0;
        }

        .log-entry.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .log-entry.warning {
            background: #fff3e0;
            color: #ef6c00;
        }

        .log-entry.error {
            background: #ffebee;
            color: #c62828;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .current-path {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: monospace;
            word-break: break-all;
            font-size: 0.9em;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-btn {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .nav-btn:hover:not(:disabled) {
            background: #5568d3;
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .directory-list {
            border: 2px solid #ddd;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }

        .directory-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .directory-item:hover {
            background: #f5f5f5;
        }

        .directory-item:last-child {
            border-bottom: none;
        }

        .directory-icon {
            font-size: 1.2em;
        }

        .modal-footer {
            padding: 20px;
            border-top: 2px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn.secondary {
            background: #eee;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Megascans Texture Converter</h1>
            <p>Convert EXR textures to PNG with custom channel packing</p>
        </div>

        <div class="content">
            <form id="conversionForm">
                <div class="form-group">
                    <label for="inputDir">Input Directory</label>
                    <div class="input-wrapper">
                        <input type="text" id="inputDir" name="inputDir" placeholder="C:\Textures\Input" required>
                        <button type="button" class="browse-btn" onclick="openBrowser('input')">Browse...</button>
                    </div>
                    <small>Folder containing your Megascans EXR files (will search subdirectories)</small>
                </div>

                <div class="form-group">
                    <label for="outputDir">Output Directory</label>
                    <div class="input-wrapper">
                        <input type="text" id="outputDir" name="outputDir" placeholder="C:\Textures\Output" required>
                        <button type="button" class="browse-btn" onclick="openBrowser('output')">Browse...</button>
                    </div>
                    <small>Folder where converted PNG files will be saved</small>
                </div>

                <button type="submit" class="btn" id="convertBtn">
                    Start Conversion
                </button>
            </form>

            <div class="progress-section" id="progressSection">
                <div class="status-text">
                    <span class="spinner"></span>
                    <span id="statusText">Processing...</span>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="successCount">0</div>
                        <div class="stat-label">Successful</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="failedCount">0</div>
                        <div class="stat-label">Failed</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                </div>

                <div class="logs-container" id="logsContainer">
                    <!-- Logs will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Directory Browser Modal -->
    <div class="modal" id="browserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Browse Directories</h2>
                <button class="close-btn" onclick="closeBrowser()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="current-path" id="currentPath"></div>
                <div class="nav-buttons">
                    <button class="nav-btn" id="upBtn" onclick="navigateUp()">⬆ Up</button>
                    <button class="nav-btn" id="rootBtn" onclick="navigateRoot()">🏠 Root/Drives</button>
                </div>
                <div class="directory-list" id="directoryList">
                    <!-- Directories will be listed here -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeBrowser()">Cancel</button>
                <button class="modal-btn primary" onclick="selectCurrentDirectory()">Select Current Directory</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('conversionForm');
        const convertBtn = document.getElementById('convertBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const successCount = document.getElementById('successCount');
        const failedCount = document.getElementById('failedCount');
        const totalCount = document.getElementById('totalCount');
        const logsContainer = document.getElementById('logsContainer');

        let statusCheckInterval = null;
        let logsCheckInterval = null;
        let lastLogCount = 0;

        // Directory browser state
        let currentBrowserPath = '';
        let parentBrowserPath = null;
        let browserTargetInput = null;

        // Load saved directories on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedInputDir = localStorage.getItem('inputDir');
            const savedOutputDir = localStorage.getItem('outputDir');

            if (savedInputDir) {
                document.getElementById('inputDir').value = savedInputDir;
            }
            if (savedOutputDir) {
                document.getElementById('outputDir').value = savedOutputDir;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const inputDir = document.getElementById('inputDir').value;
            const outputDir = document.getElementById('outputDir').value;

            // Save directories to localStorage
            localStorage.setItem('inputDir', inputDir);
            localStorage.setItem('outputDir', outputDir);

            // Disable form
            convertBtn.disabled = true;
            convertBtn.textContent = 'Converting...';

            // Show progress section
            progressSection.classList.add('active');
            logsContainer.innerHTML = '';
            lastLogCount = 0;

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        input_dir: inputDir,
                        output_dir: outputDir
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert('Error: ' + error.error);
                    convertBtn.disabled = false;
                    convertBtn.textContent = 'Start Conversion';
                    return;
                }

                // Start polling for status and logs
                startStatusPolling();
                startLogsPolling();

            } catch (error) {
                alert('Error: ' + error.message);
                convertBtn.disabled = false;
                convertBtn.textContent = 'Start Conversion';
            }
        });

        function startStatusPolling() {
            statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/status');
                    const data = await response.json();

                    if (data.total > 0) {
                        const percentage = Math.round((data.progress / data.total) * 100);
                        progressBar.style.width = percentage + '%';
                        progressBar.textContent = percentage + '%';
                    }

                    if (data.current_file) {
                        statusText.textContent = `Processing: ${data.current_file}`;
                    }

                    successCount.textContent = data.successful;
                    failedCount.textContent = data.failed;
                    totalCount.textContent = data.total;

                    // If conversion is complete
                    if (!data.running && data.total > 0 && data.progress >= data.total) {
                        clearInterval(statusCheckInterval);
                        clearInterval(logsCheckInterval);
                        convertBtn.disabled = false;
                        convertBtn.textContent = 'Start Conversion';
                        statusText.innerHTML = '<strong>Conversion Complete!</strong>';
                        progressSection.querySelector('.spinner').style.display = 'none';
                    }

                } catch (error) {
                    console.error('Status check error:', error);
                }
            }, 500);
        }

        function startLogsPolling() {
            logsCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/logs');
                    const data = await response.json();

                    // Only add new logs
                    if (data.logs.length > lastLogCount) {
                        const newLogs = data.logs.slice(lastLogCount);
                        newLogs.forEach(log => {
                            const logEntry = document.createElement('div');
                            logEntry.className = `log-entry ${log.level}`;
                            logEntry.textContent = log.message;
                            logsContainer.appendChild(logEntry);
                        });

                        // Auto-scroll to bottom
                        logsContainer.scrollTop = logsContainer.scrollHeight;
                        lastLogCount = data.logs.length;
                    }

                } catch (error) {
                    console.error('Logs check error:', error);
                }
            }, 500);
        }

        // Directory browser functions
        async function openBrowser(targetType) {
            browserTargetInput = targetType;
            const inputField = targetType === 'input' ? document.getElementById('inputDir') : document.getElementById('outputDir');
            const currentValue = inputField.value;

            // Start from the current value if it exists, otherwise start from root/drives
            await loadDirectory(currentValue || '');
            document.getElementById('browserModal').classList.add('active');
        }

        function closeBrowser() {
            document.getElementById('browserModal').classList.remove('active');
        }

        async function loadDirectory(path) {
            try {
                const response = await fetch('/api/browse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: path })
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                currentBrowserPath = data.current_path;
                parentBrowserPath = data.parent_path;

                // Update current path display
                const currentPathElement = document.getElementById('currentPath');
                currentPathElement.textContent = currentBrowserPath || 'Select a drive:';

                // Update up button state
                const upBtn = document.getElementById('upBtn');
                upBtn.disabled = !parentBrowserPath;

                // Update directory list
                const directoryList = document.getElementById('directoryList');
                directoryList.innerHTML = '';

                if (data.items.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.style.padding = '20px';
                    emptyMsg.style.textAlign = 'center';
                    emptyMsg.style.color = '#999';
                    emptyMsg.textContent = 'No subdirectories found';
                    directoryList.appendChild(emptyMsg);
                } else {
                    data.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'directory-item';
                        itemDiv.onclick = () => loadDirectory(item.path);

                        const icon = document.createElement('span');
                        icon.className = 'directory-icon';
                        icon.textContent = item.is_drive ? '💾' : '📁';

                        const name = document.createElement('span');
                        name.textContent = item.name;

                        itemDiv.appendChild(icon);
                        itemDiv.appendChild(name);
                        directoryList.appendChild(itemDiv);
                    });
                }

            } catch (error) {
                alert('Error loading directory: ' + error.message);
            }
        }

        async function navigateUp() {
            if (parentBrowserPath) {
                await loadDirectory(parentBrowserPath);
            }
        }

        async function navigateRoot() {
            await loadDirectory('');
        }

        function selectCurrentDirectory() {
            if (!currentBrowserPath) {
                alert('Please select a directory');
                return;
            }

            const inputField = browserTargetInput === 'input'
                ? document.getElementById('inputDir')
                : document.getElementById('outputDir');

            inputField.value = currentBrowserPath;

            // Save to localStorage immediately
            localStorage.setItem(browserTargetInput === 'input' ? 'inputDir' : 'outputDir', currentBrowserPath);

            closeBrowser();
        }

        // Close modal when clicking outside
        document.getElementById('browserModal').addEventListener('click', (e) => {
            if (e.target.id === 'browserModal') {
                closeBrowser();
            }
        });
    </script>
</body>
</html>
